name: respiratory-classifier

services:
  ml:
    build:
      context: ./backend
      dockerfile: python_service/Dockerfile
    image: respiratory-classifier/ml:latest
    restart: unless-stopped
    expose:
      - "5001"
    deploy:
      resources:
        limits:
          memory: 3g

  backend:
    build:
      context: ./backend
    image: respiratory-classifier/backend:latest
    restart: unless-stopped
    environment:
      PORT: 5000
      PYTHON_API_URL: http://ml:5001
    expose:
      - "5000"
    depends_on:
      ml:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: respiratory-classifier/frontend:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
