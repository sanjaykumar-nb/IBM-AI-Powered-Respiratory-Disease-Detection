name: respiratory-classifier

services:
  ml:
    build:
      context: ./backend
      dockerfile: python_service/Dockerfile
      target: runtime
    image: respiratory-classifier/ml:latest
    restart: unless-stopped
    expose:
      - "5001"
    deploy:
      resources:
        limits:
          memory: 3g

  backend:
    build:
      context: ./backend
    image: respiratory-classifier/backend:latest
    restart: unless-stopped
    environment:
      PORT: 5000
      PYTHON_API_URL: http://ml:5001
    expose:
      - "5000"
    depends_on:
      ml:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: respiratory-classifier/frontend:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Training notebook (train_on_linuxone.ipynb). Not started by deploy.sh - use deploy/jupyter.sh.
  # Same ML environment as the inference service; the whole repository is mounted at /workspace.
  # Bound to 127.0.0.1 only: reach it through an SSH tunnel, never directly from the internet.
  jupyter:
    profiles: ["training"]
    build:
      context: ./backend
      dockerfile: python_service/Dockerfile
      target: jupyter
    image: respiratory-classifier/jupyter:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ..:/workspace
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    deploy:
      resources:
        limits:
          memory: 5g
