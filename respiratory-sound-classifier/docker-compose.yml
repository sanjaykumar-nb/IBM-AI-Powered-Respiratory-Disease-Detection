name: respiratory-classifier

services:
  ml:
    build:
      context: ./backend
      dockerfile: python_service/Dockerfile
      target: runtime
    image: respiratory-classifier/ml:latest
    restart: unless-stopped
    expose:
      - "5001"
    deploy:
      resources:
        limits:
          memory: 3g

  backend:
    build:
      context: ./backend
    image: respiratory-classifier/backend:latest
    restart: unless-stopped
    environment:
      PORT: 5000
      PYTHON_API_URL: http://ml:5001
      DB2_HOST: db2
      DB2_PORT: 50000
      DB2_DATABASE: ${DB2_DBNAME:-SCREEN}
      DB2_USER: db2inst1
      DB2_PASSWORD: ${DB2_PASSWORD:-}
    expose:
      - "5000"
    # No dependency on db2: screening works while Db2 is starting or down (results are then not recorded).
    depends_on:
      ml:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: respiratory-classifier/frontend:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  # IBM Db2 Community Edition: audit trail of screening results (never audio), shown on the History page.
  # Published for amd64 and s390x. Privileged because the image requires it (it tunes kernel IPC settings).
  # First start creates the instance and database and takes several minutes; later starts take ~1 minute.
  # Reachable only from the other containers on the compose network.
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    privileged: true
    restart: unless-stopped
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-}
      DBNAME: ${DB2_DBNAME:-SCREEN}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      IS_OSXFS: "false"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
      DB2_INSTANCE_MEMORY_MB: 2048 # applied by deploy/db2/limit-memory.sh; keep below the 3g limit
    volumes:
      - db2-data:/database
      - ./deploy/db2/limit-memory.sh:/var/custom/limit-memory.sh:ro
    expose:
      - "50000"
    healthcheck:
      # Double quotes: $DBNAME must be expanded here, `su -` starts db2inst1's shell without it
      test: ["CMD-SHELL", "su - db2inst1 -c \"db2 connect to $$DBNAME >/dev/null && db2 terminate >/dev/null\""]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 20m
    deploy:
      resources:
        limits:
          memory: 3g

  # Training notebook (train_on_linuxone.ipynb). Not started by deploy.sh - use deploy/jupyter.sh.
  # Same ML environment as the inference service; the whole repository is mounted at /workspace.
  # Bound to 127.0.0.1 only: reach it through an SSH tunnel, never directly from the internet.
  jupyter:
    profiles: ["training"]
    build:
      context: ./backend
      dockerfile: python_service/Dockerfile
      target: jupyter
    image: respiratory-classifier/jupyter:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ..:/workspace
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    deploy:
      resources:
        limits:
          memory: 5g

volumes:
  db2-data:
